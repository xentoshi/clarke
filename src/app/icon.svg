<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <defs>
    <clipPath id="ring-back">
      <rect x="0" y="0" width="32" height="16"/>
    </clipPath>
    <clipPath id="ring-front">
      <rect x="0" y="16" width="32" height="16"/>
    </clipPath>
  </defs>
  <!-- Back half of orbital ring -->
  <ellipse cx="16" cy="16" rx="13" ry="4.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" clip-path="url(#ring-back)"/>
  <!-- Earth -->
  <circle cx="16" cy="16" r="5" fill="white"/>
  <!-- Front half of orbital ring -->
  <ellipse cx="16" cy="16" rx="13" ry="4.5" stroke="white" stroke-width="1.5" clip-path="url(#ring-front)"/>
</svg>
