name: Scheduled data ingest

# Keeps data/clarke.db from going silently stale. Runs UCS, Space-Track, and
# SEC EDGAR ingest on a schedule and commits the refreshed database straight
# to main if anything changed. FCC-SSAL is excluded, see below. Low blast
# radius (data only, easily reverted) and no human has to remember to run
# this by hand.

on:
  schedule:
    # 06:17 UTC daily — off-peak, deliberately not on the hour.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scheduled-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # FCC-SSAL is deliberately excluded: fcc.gov sits behind Akamai bot
      # protection that returns "Access Denied" to automated requests (curl
      # and headless Chromium both blocked), so ingest-fcc.ts only ever
      # re-parses the locally committed data/ssal.xlsx rather than fetching
      # anything live. Running it here would make the freshness panel claim
      # a daily FCC update that never actually happened. Refresh that file
      # by hand (download from https://www.fcc.gov/approved-space-station-list,
      # replace data/ssal.xlsx, run npm run ingest:fcc, commit).
      - name: Run ingest pipeline (UCS + Space-Track + SEC EDGAR)
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: npm run ingest && npm run ingest:spacetrack && npm run ingest:sec

      - name: Commit and push if data changed
        run: |
          git config user.name "clarke-ingest-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/clarke.db; then
            echo "No data changes, nothing to commit."
            exit 0
          fi
          git add data/clarke.db
          git commit -m "Scheduled data refresh ($(date -u +%Y-%m-%d))"
          git push
