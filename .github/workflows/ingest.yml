name: Monthly data ingest

# Keeps data/clarke.db from going silently stale. Runs UCS, Space-Track, and
# SEC EDGAR ingest once a month and commits the refreshed database straight
# to main if anything changed. FCC-SSAL is excluded, see below. Low blast
# radius (data only, easily reverted). workflow_dispatch remains for a manual run.

on:
  schedule:
    # 06:17 UTC on the 1st (14:17 HKT). Off the hour.
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scheduled-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # FCC-SSAL is not fetched here: fcc.gov is behind Akamai. Monthly
      # `.github/workflows/ingest-fcc.yml` re-parses the committed
      # data/ssal.xlsx and records workbook vintage (not a fake refresh date).
      # Human download steps: docs/FCC_REFRESH.md.
      - name: Run ingest pipeline (UCS + Space-Track + SEC EDGAR)
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: npm run ingest && npm run ingest:spacetrack && npm run ingest:sec

      - name: Commit and push if data changed
        run: |
          git config user.name "clarke-ingest-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/clarke.db; then
            echo "No data changes, nothing to commit."
            exit 0
          fi
          git add data/clarke.db
          git commit -m "Monthly data refresh ($(date -u +%Y-%m-%d))"
          git push
