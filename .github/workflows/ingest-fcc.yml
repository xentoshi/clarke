name: Weekly FCC SSAL re-parse

# Re-reads the committed data/ssal.xlsx. Does not fetch fcc.gov (Akamai).
# Product as-of is the workbook sheet vintage, not last_run. See docs/FCC_REFRESH.md.

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-fcc-ingest
  cancel-in-progress: false

jobs:
  ingest-fcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Parse committed SSAL workbook
        run: npm run ingest:fcc && npm run vintages

      - name: Commit and push if data changed
        run: |
          git config user.name "clarke-ingest-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/clarke.db; then
            echo "No data changes, nothing to commit."
            exit 0
          fi
          git add data/clarke.db
          git commit -m "Weekly FCC SSAL re-parse ($(date -u +%Y-%m-%d))"
          git push
